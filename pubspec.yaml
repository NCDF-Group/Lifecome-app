name: lifecome_mobile
description: "LifeCome Live patient app: online consultations, care plans and health records."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^18.0.1

  # State management
  flutter_riverpod: ^3.4.3

  # SVG logo assets, shared with the website
  flutter_svg: ^2.3.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5

  # HTTP client for Lifecome-Backen (see core/network/api_client.dart)
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/welcome/
    - assets/images/home/

  # Liberation Sans, bundled so the app never waits on a font CDN (OFL).
  fonts:
    - family: Liberation Sans
      fonts:
        - asset: assets/fonts/LiberationSans/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSans/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  # Regenerate with `dart run flutter_launcher_icons` after changing the mark
  # (assets/icons/app_icon.png, rasterised from assets/images/logo/lifecome-live-mark.svg).
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
